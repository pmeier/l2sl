[build-system]
requires = [
    "setuptools>=64",
    "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "l2sl"
description = "logging to structured logging"
license = {file = "LICENSE"}
authors = [
    { name = "Philip Meier", email = "github.pmeier@posteo.de" },
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "structlog>=25.2.0",
]

[dependency-groups]
dev = [
    "mdx-truly-sane-lists>=1.3",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=1.15.0",
    "pydantic>=2",
    "pytest>=9",
    "pytest-coverage>=0.0",
    "pytest-mock>=3.16.0",
    "zensical>=0.0.64",
]

[project.urls]
Repository = "https://github.com/pmeier/l2sl"
Documentation = "https://l2sl.readthedocs.io/en/stable/"

[tool.setuptools_scm]
write_to = "src/l2sl/_version.py"
version_scheme = "release-branch-semver"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I001",
    "D"
]

ignore = [
    # Ambigiuous variable name
    "E741",
    # Magic methods like __eq__ and __str__ do not need docstrings
    "D105",
    # __init__ docstrings are merged into the class docstring
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are self-describing via their names; no docstrings needed
"tests/*" = ["D1"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--tb=short"]

testpaths = [
    "tests",
]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]
xfail_strict = true

[tool.mypy]
files = "src/l2sl"

show_error_codes = true
pretty = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

allow_redefinition = true
no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true

warn_return_any = true
warn_unused_configs = true
